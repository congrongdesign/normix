appId: com.normix.desktop
productName: Normix
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - server.mjs
  - lib/**/*
  - config/**/*
  - electron/**/*
  - build/icon.png
  - package.json
asar: false
npmRebuild: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: Normix-${version}-mac-${arch}.${ext}

dmg:
  title: Normix ${version}
  icon: build/icon.icns
  artifactName: Normix-${version}-mac-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable
  artifactName: Normix-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Normix
  artifactName: Normix-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: Normix-${version}-win-${arch}-portable.${ext}

publish: null
